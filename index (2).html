<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1d9bf0">
<meta name="description" content="Free post maker: turn your text into an aesthetic social media post image. Pick a theme, ratio and resolution, then download. Works on phone and desktop.">
<meta property="og:title" content="Post Maker">
<meta property="og:description" content="Make aesthetic social media post images in seconds. Free, private, works on any device.">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💬%3C/text%3E%3C/svg%3E">
<title>Post Maker</title>
<!-- Created by @fforfermium -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto:wght@400;700&family=Quicksand:wght@400;700&family=Playfair+Display:wght@400;700&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{--bg:#f3f2f7;--panel:#fff;--ink:#17181c;--mute:#6a6f7b;--line:#e3e4ea;--acc:#1d9bf0;--field:#f7f7fa}
@media(prefers-color-scheme:dark){:root{--bg:#0d0e12;--panel:#17191f;--ink:#eceef3;--mute:#9a9fac;--line:#2a2d37;--field:#101217}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.45 "Helvetica Neue",Helvetica,Arial,"Segoe UI",sans-serif;padding:24px 16px}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:26px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 22px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
label{display:block;font-weight:600;font-size:13.5px;margin:14px 0 6px}
.hint{font-weight:400;color:var(--mute)}
input[type=text],input[type=number],input[type=datetime-local],select,#ed{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font:inherit}
input[type=color]{padding:0;height:32px;width:38px;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}
input[type=range]{width:100%}
input:focus,select:focus,#ed:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#ed{min-height:120px;white-space:pre-wrap}#ed:empty:before{content:attr(data-ph);color:var(--mute)}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.avrow{display:flex;align-items:center;gap:14px}
.thumb{width:60px;height:60px;border-radius:14px;background:var(--field);border:1px dashed var(--line);object-fit:cover;flex:none}
.chks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;margin:0}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--acc);color:#fff}
button.g{background:var(--field);color:var(--ink);border:1px solid var(--line)}
.tb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 6px}.tb button{padding:5px 10px;min-width:34px}
.sw{width:22px;height:22px;min-width:0!important;border-radius:50%;padding:0!important;border:2px solid #fff!important;box-shadow:0 0 0 1px #0003}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1}.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.themes button{padding:14px 4px;font-size:13px;border-radius:12px}.themes button.on{outline:3px solid var(--acc);outline-offset:2px}
.setup{max-width:560px;margin:0 auto}.setup .go{width:100%;margin-top:20px;padding:13px}
.studio{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
@media(max-width:860px){.studio{grid-template-columns:1fr}}
.left{position:sticky;top:12px}
.stage{background-image:linear-gradient(45deg,#8883 25%,transparent 25%,transparent 75%,#8883 75%),linear-gradient(45deg,#8883 25%,transparent 25%,transparent 75%,#8883 75%);background-size:20px 20px;background-position:0 0,10px 10px;border-radius:16px;border:1px solid var(--line);padding:14px;display:flex;justify-content:center}
canvas{max-width:100%;max-height:74vh;width:auto;height:auto;display:block;border-radius:6px}
.info{font-size:13px;color:var(--mute);margin-top:8px}
.btns{display:flex;gap:10px;margin-top:18px}.btns button{flex:1}
.hidden{display:none!important}
html{-webkit-text-size-adjust:100%}
body{padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button,select,input{touch-action:manipulation}
@media(pointer:coarse){button{min-height:44px}.sw{width:30px;height:30px}input[type=color]{height:40px;width:46px}}
@media(max-width:860px){
input[type=text],input[type=number],input[type=datetime-local],select,#ed{font-size:16px}
.studio{display:block}
.left{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 8px}
.stage{padding:8px}
canvas{max-height:34vh;max-height:34dvh}
.studio .panel{margin-top:10px;padding:16px}
h1{font-size:22px}.sub{margin-bottom:16px}
}
@media(max-width:420px){.themes{grid-template-columns:repeat(2,1fr)}.tabs button{padding:10px 6px}.chks{grid-template-columns:1fr}}
footer{text-align:center;color:var(--mute);font-size:13px;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
<h1>Post Maker</h1>
<p class="sub">Write a post, pick a style, download a sharp image.</p>

<section id="setup" class="setup"><div class="panel">
<div id="fields">
  <label>Profile photo</label>
  <div class="avrow"><img id="thumb" class="thumb" alt=""><input id="file" type="file" accept="image/*"></div>
  <div class="row">
    <div><label for="name">Name</label><input id="name" type="text" placeholder="Jo Brodie"></div>
    <div><label for="handle">Handle</label><input id="handle" type="text" placeholder="@JoBrodie"></div>
  </div>
  <label>Post text <span class="hint">(select words, then color or style them)</span></label>
  <div class="tb">
    <button type="button" class="g" data-c="bold"><b>B</b></button>
    <button type="button" class="g" data-c="italic"><i>I</i></button>
    <button type="button" class="g" data-c="underline"><u>U</u></button>
    <span class="hint">Text</span><input type="color" id="fc" value="#ec4899" title="Text color">
    <span class="hint">Highlight</span><input type="color" id="hc" value="#fde047" title="Highlight color">
    <button type="button" class="g" data-c="removeFormat" title="Clear styling">Clear</button>
  </div>
  <div class="tb" id="sw"></div>
  <div id="ed" contenteditable="true" data-ph="Write your post here…"></div>
  <div class="row">
    <div><label for="when">Date and time</label><input id="when" type="datetime-local"></div>
    <div><label for="extra">Extra line <span class="hint">(optional)</span></label><input id="extra" type="text" placeholder="Twitter for iPhone"></div>
  </div>
  <div class="row">
    <div><label for="likes">Likes <span class="hint">(optional)</span></label><input id="likes" type="text" placeholder="1.2K"></div>
    <div><label for="replies">Replies <span class="hint">(optional)</span></label><input id="replies" type="text" placeholder="48"></div>
  </div>
  <div class="chks">
    <label class="chk"><input id="ver" type="checkbox"> Verified badge</label>
    <label class="chk"><input id="follow" type="checkbox" checked> “Follow” label</label>
    <label class="chk"><input id="acts" type="checkbox" checked> Like / Reply row</label>
    <label class="chk"><input id="auto" type="checkbox" checked> Color @, # and links</label>
  </div>
</div>
<button class="go" id="ok">OK, create post</button>
</div></section>

<section id="studio" class="studio hidden">
  <div class="left"><div class="stage"><canvas id="cv"></canvas></div><div class="info" id="size"></div></div>
  <div class="panel">
    <div class="tabs"><button class="g on" data-t="content">Content</button><button class="g" data-t="look">Look</button><button class="g" data-t="export">Export</button></div>
    <div id="t-content"></div>

    <div id="t-look" class="hidden">
      <div class="themes" id="themes"></div>
      <div class="btns" style="margin-top:10px"><button class="g" id="rnd">🎲 Surprise me</button></div>
      <label for="font">Font</label><select id="font"></select>
      <div class="row">
        <div><label for="tsz">Text size</label><input id="tsz" type="range" min="20" max="52" value="30"></div>
        <div><label for="align">Text align</label><select id="align"><option value="0">Left</option><option value=".5">Center</option><option value="1">Right</option></select></div>
      </div>
      <div class="row">
        <div><label for="avr">Photo shape</label><select id="avr"><option value="14">Rounded square</option><option value="21">Squircle</option><option value="29">Circle</option><option value="2">Sharp</option></select></div>
        <div><label for="zoom">Card size</label><input id="zoom" type="range" min="60" max="100" value="100"></div>
      </div>
      <label for="bg">Background</label><select id="bg"></select>
      <div id="cbg" class="row hidden" style="margin-top:8px"><input type="color" id="c1" value="#e9d5ff" style="width:100%"><input type="color" id="c2" value="#fbcfe8" style="width:100%"></div>
      <div id="ibg" class="hidden" style="margin-top:8px"><input type="file" id="bgfile" accept="image/*"></div>
      <label for="decor">Decoration</label>
      <select id="decor"><option value="auto">Theme default</option><option value="none">None</option><option value="hearts">Hearts</option><option value="sparkles">Sparkles</option><option value="dots">Dots</option><option value="orbs">Glow orbs</option></select>
    </div>

    <div id="t-export" class="hidden">
      <label for="ratio">Aspect ratio</label><select id="ratio"></select>
      <div id="cratio" class="row hidden" style="margin-top:8px"><input id="cw" type="number" min="1" value="4"><input id="ch" type="number" min="1" value="5"></div>
      <label for="res">Resolution <span class="hint">(shorter side)</span></label><select id="res"></select>
      <div id="cres" class="hidden" style="margin-top:8px"><input id="cresv" type="number" min="100" max="10000" value="1500"></div>
      <label for="fmt">Format</label><select id="fmt"><option value="image/png">PNG (sharpest, transparent OK)</option><option value="image/jpeg">JPG (smaller file)</option></select>
      <div class="btns"><button class="g hidden" id="sh">Share / Save</button><button class="g" id="cp">Copy image</button><button id="dl">Download</button></div>
      <div class="info">Resolution is the shorter side: 1080p at 16:9 is 1920×1080, 4K is 3840×2160, 8K is 7680×4320.</div>
    </div>
  </div>
</section>
<noscript><p class="sub">Please turn on JavaScript to use Post Maker.</p></noscript>
<footer>Made by <span id="credit"></span><br>Your photos and text stay on your device. Nothing is uploaded.</footer>
</div>

<script>
const CREDIT = "@fforfermium"; // permanent watermark handle (not editable in the UI)
const $ = id => document.getElementById(id);
const LW = 600, PAD = 30, AV = 58;
let avatar = null, bgImg = null, theme = 0, FF = "";
const EMO = ',"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji"';
const FONTS = {
  inter: 'Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif' + EMO,
  quick: 'Quicksand,"Segoe UI",Arial,sans-serif' + EMO,
  serif: '"Playfair Display",Georgia,serif' + EMO,
  mono: '"Space Mono","Courier New",monospace' + EMO,
  roboto: 'Roboto,system-ui,"Segoe UI",Arial,sans-serif' + EMO,
  system: 'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif' + EMO,
  helv: '"Helvetica Neue",Helvetica,Arial,sans-serif' + EMO
};
const FONTN = [["auto", "Theme font"], ["inter", "Inter"], ["quick", "Quicksand (cute)"], ["serif", "Playfair (elegant)"], ["mono", "Space Mono (retro)"], ["roboto", "Roboto"], ["system", "System"], ["helv", "Helvetica / Arial"]];
const RATIOS = [["Card only (auto fit)", "auto"], ["1:1 Square", "1:1"], ["4:5 Portrait", "4:5"], ["5:4", "5:4"], ["3:4", "3:4"], ["4:3", "4:3"], ["2:3", "2:3"], ["3:2", "3:2"], ["9:16 Story / Reel", "9:16"], ["16:9 Widescreen", "16:9"], ["1.91:1 Link preview", "191:100"], ["2:1", "2:1"], ["3:1 Banner", "3:1"], ["21:9 Ultrawide", "21:9"], ["Custom…", "custom"]];
const RES = [["240p", 240], ["360p", 360], ["480p (SD)", 480], ["720p (HD)", 720], ["1080p (Full HD)", 1080], ["1440p (2K)", 1440], ["2160p (4K)", 2160], ["2880p (5K)", 2880], ["4320p (8K)", 4320], ["Custom…", "custom"]];
const BGS = [["Lilac blush", ["#e9d5ff", "#fbcfe8"]], ["Sky", ["#bae6fd", "#c7d2fe"]], ["Peach", ["#fed7aa", "#fecdd3"]], ["Mint", ["#a7f3d0", "#bae6fd"]], ["Aurora", ["#0f172a", "#4c1d95", "#be185d"]], ["Sunset", ["#fda4af", "#fdba74", "#fde68a"]], ["Pookie pink", ["#ffd6e7", "#ffb3d1"]], ["Cream", ["#fdf6e3", "#f3e6c8"]], ["Midnight", ["#05030f", "#1e1b4b"]], ["White", ["#ffffff"]], ["Black", ["#000000"]], ["Transparent (PNG)", null], ["Custom 2 colors…", 0], ["Upload image…", 0]];
const THEMES = [
  { n: "Classic", card: "#ffffff", ink: "#0f1419", gray: "#536471", line: "#e4e8ec", acc: "#1d9bf0", like: "#f0457a", r: 22, bg: 1, f: "inter" },
  { n: "Dark", card: "#0c0f14", ink: "#e7e9ea", gray: "#8b98a5", line: "#2f3336", acc: "#1d9bf0", like: "#f0457a", r: 22, bg: 8, f: "inter" },
  { n: "Glass", card: "rgba(255,255,255,.16)", glass: 1, ink: "#ffffff", gray: "rgba(255,255,255,.78)", line: "rgba(255,255,255,.3)", acc: "#7dd3fc", like: "#ff8fc0", vc: "#0c4a6e", r: 30, bd: "rgba(255,255,255,.55)", bw: 2, bg: 4, dc: "orbs", sh: .14, f: "inter" },
  { n: "Pookie", card: "#fff5f9", ink: "#7a2e4d", gray: "#c0678f", line: "#ffc2da", acc: "#ff4d94", like: "#ff4d94", r: 38, bd: "#ffb3d1", bw: 5, bg: 6, dc: "hearts", dcol: "#ff7aa8", f: "quick" },
  { n: "Lavender", card: "#f6f1ff", ink: "#3b2a66", gray: "#7c6aa8", line: "#e0d4fb", acc: "#8b5cf6", like: "#d946ef", r: 28, bg: 0, dc: "sparkles", dcol: "#ffffff", f: "quick" },
  { n: "Sunset", card: ["#ff9a8b", "#ff5f8a"], ink: "#ffffff", gray: "rgba(255,255,255,.85)", line: "rgba(255,255,255,.35)", acc: "#fff3b0", like: "#ffffff", vc: "#ff5f8a", r: 30, bg: 1, f: "inter" },
  { n: "Neon", card: "#0b0820", ink: "#f5f3ff", gray: "#a5a0d6", line: "#2a2352", acc: "#22d3ee", like: "#f472b6", vc: "#0b0820", r: 20, bd: "#8b5cf6", bw: 2.5, glow: 1, bg: 8, dc: "dots", dcol: "#8b5cf6", f: "inter" },
  { n: "Paper", card: "#fbf5e9", ink: "#3d3226", gray: "#8a7a63", line: "#e0d1b4", acc: "#b45309", like: "#b91c1c", r: 8, bd: "#d9c9a8", bw: 2, bg: 7, f: "serif" },
  { n: "Terminal", card: "#070b07", ink: "#7cfc9a", gray: "#4ea36a", line: "#17381f", acc: "#d9f99d", like: "#7cfc9a", vc: "#070b07", r: 6, bd: "#1f5a2d", bw: 2, bg: 10, f: "mono" }
];
const COLS = ["#ef4444", "#f97316", "#eab308", "#22c55e", "#06b6d4", "#3b82f6", "#a855f7", "#ec4899", "#111111", "#ffffff"];
const ICON = {
  heart: "M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z",
  chat: "M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z",
  link: "M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z",
  spark: "M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"
};

// ---------- UI setup ----------
const add = (el, list) => list.forEach(([l, v]) => el.add(new Option(l, v)));
add($("ratio"), RATIOS); add($("res"), RES); add($("font"), FONTN.map(([v, l]) => [l, v]));
BGS.forEach(([l], i) => $("bg").add(new Option(l, i)));
$("ratio").value = "1:1"; $("res").value = 1080;
$("credit").textContent = CREDIT;
const p2 = n => String(n).padStart(2, "0");
const dn = new Date(); $("when").value = `${dn.getFullYear()}-${p2(dn.getMonth() + 1)}-${p2(dn.getDate())}T${p2(dn.getHours())}:${p2(dn.getMinutes())}`;
try { const s = JSON.parse(localStorage.getItem("pm") || "{}"); if (s.name) $("name").value = s.name; if (s.handle) $("handle").value = s.handle; if (s.theme >= 0) theme = s.theme; } catch (e) {}

THEMES.forEach((t, i) => {
  const b = document.createElement("button"); b.textContent = t.n;
  const bgc = Array.isArray(t.card) ? `linear-gradient(135deg,${t.card[0]},${t.card[1]})` : t.card;
  b.style.cssText = `background:${t.glass ? "linear-gradient(135deg,#4c1d95,#be185d)" : bgc};color:${t.ink};border:${t.bd ? "2px solid " + t.bd : "1px solid #8884"}`;
  b.onclick = () => setTheme(i); $("themes").appendChild(b);
});
function setTheme(i) {
  theme = i; const t = THEMES[i];
  $("font").value = "auto"; $("bg").value = t.bg; $("decor").value = "auto";
  [...$("themes").children].forEach((b, j) => b.classList.toggle("on", j === i)); upd();
}
$("rnd").onclick = () => { setTheme(Math.floor(Math.random() * THEMES.length)); $("bg").value = Math.floor(Math.random() * 9); upd(); };

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  ["content", "look", "export"].forEach(t => $("t-" + t).classList.toggle("hidden", t !== b.dataset.t));
});

// rich text editor
let sel = null;
document.addEventListener("selectionchange", () => { const s = getSelection(); if (s.rangeCount && $("ed").contains(s.anchorNode)) sel = s.getRangeAt(0).cloneRange(); });
function fmt(cmd, val) {
  $("ed").focus(); if (sel) { const s = getSelection(); s.removeAllRanges(); s.addRange(sel); }
  document.execCommand("styleWithCSS", false, true); document.execCommand(cmd, false, val); upd();
}
document.querySelectorAll("[data-c]").forEach(b => { b.onmousedown = e => e.preventDefault(); b.onclick = () => fmt(b.dataset.c); });
$("fc").oninput = e => fmt("foreColor", e.target.value);
$("hc").oninput = e => fmt("hiliteColor", e.target.value);
COLS.forEach(c => { const b = document.createElement("button"); b.className = "sw"; b.style.background = c; b.title = c; b.onmousedown = e => e.preventDefault(); b.onclick = () => fmt("foreColor", c); $("sw").appendChild(b); });
$("ed").onpaste = e => { e.preventDefault(); document.execCommand("insertText", false, e.clipboardData.getData("text/plain")); };

function readImg(file, cb) { if (!file) return; const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => cb(im); im.src = r.result; }; r.readAsDataURL(file); }
$("file").onchange = e => readImg(e.target.files[0], im => { avatar = im; $("thumb").src = im.src; upd(); });
$("bgfile").onchange = e => readImg(e.target.files[0], im => { bgImg = im; upd(); });

$("ok").onclick = () => { $("t-content").appendChild($("fields")); $("setup").classList.add("hidden"); $("studio").classList.remove("hidden"); setTheme(theme); };

// ---------- text parsing and layout ----------
function runs() {
  const out = [];
  (function walk(n, st) {
    for (const c of n.childNodes) {
      if (c.nodeType === 3) { out.push({ ...st, t: c.nodeValue.replace(/[\n\u00a0]/g, " ") }); continue; }
      if (c.nodeType !== 1) continue;
      const tg = c.tagName, cs = c.style, s = { ...st };
      if (tg === "BR") { out.push({ ...st, t: "\n" }); continue; }
      if (tg === "B" || tg === "STRONG" || cs.fontWeight === "bold" || +cs.fontWeight >= 600) s.b = 1;
      if (tg === "I" || tg === "EM" || cs.fontStyle === "italic") s.i = 1;
      if (tg === "U" || /underline/.test(cs.textDecoration + cs.textDecorationLine)) s.u = 1;
      if (cs.color) s.c = cs.color; if (tg === "FONT" && c.color) s.c = c.color;
      if (cs.backgroundColor) s.h = cs.backgroundColor;
      if ((tg === "DIV" || tg === "P") && out.length && out[out.length - 1].t !== "\n") out.push({ ...st, t: "\n" });
      walk(c, s);
    }
  })($("ed"), {});
  return out;
}
const mc = document.createElement("canvas").getContext("2d");
const fnt = (st, sz) => `${st.i ? "italic " : ""}${st.b ? 700 : 400} ${sz}px ${FF}`;
function layout(rs, max, sz) {
